# ====== 本地持续交付编排配置 ======
# 本地事件/租约/清单持久化目录（重启恢复依据，勿随意删除）
delivery.data-dir=./target/delivery-data
# 单进程阶段执行并发上限与排队上限（超出排队额度按 QUEUE_FULL 拒绝）
delivery.max-concurrency=2
delivery.max-queue=16
# 等待执行槽位的最长时间（毫秒）；超时按额度拒绝，不无限占用
delivery.capacity-wait-millis=2000
# 目标租约 TTL 与续租周期；进程崩溃超过 TTL 后租约可被安全接管
delivery.lease-ttl-millis=10000
delivery.lease-renew-millis=3000
# 启动时先事件重放恢复，再自动收敛一次
delivery.auto-reconcile-on-startup=true

spring.application.name=gitops-delivery-java
