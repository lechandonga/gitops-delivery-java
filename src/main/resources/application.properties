# 本地持续交付编排配置
spring.application.name=gitops-delivery-java

# 本地状态持久化目录（WAL 事件 + 快照）
delivery.data-dir=${java.io.tmpdir}/gitops-delivery-data
# 并发与排队上限（有界）
delivery.max-concurrency=2
delivery.max-queue=10
# 目标租约 TTL（毫秒），过期后可被安全接管
delivery.lease-ttl-ms=10000
# 周期声明式收敛循环（默认关闭，需要时置 true）
delivery.scheduler-enabled=false
delivery.reconcile-interval-ms=5000
# 执行者标识前缀
delivery.executor-id=executor-local
